name: CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: attendance_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Load MySQL schema and seed data
        run: |
          mysql --host=127.0.0.1 --user=root --password=root < schema.sql
          mysql --host=127.0.0.1 --user=root --password=root < docs/testing/data/seed.sql
      - name: Run SQL verification scripts
        run: |
          for script in docs/testing/data/verify_*.sql; do
            echo "Running $script"
            mysql --host=127.0.0.1 --user=root --password=root < "$script"
          done
      - run: mvn -B test